# Configuration Netlify — site statique, aucune étape de build.
[build]
  publish = "."
  command = ""

# Cache long sur les ressources versionnables, cache court sur le HTML
# pour que les mises à jour de contenu soient visibles immédiatement.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
